[package]
name = "nova-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Nativer Nova-Desktop-Client (iced/wgpu, ohne WebView)"

[[bin]]
name = "nova-desktop"
path = "src/main.rs"

[dependencies]
nova-common = { path = "../common" }
chrono.workspace = true
futures-util = { workspace = true, features = ["sink"] }
# CPU-Renderer (tiny-skia) statt wgpu: gemessen ~32 MB statt 130–200 MB RAM
# und keine 250–500 ms GPU-Initialisierung beim Start. `--features gpu`
# schaltet wgpu wieder zu (sinnvoll erst für Video/Screenshare).
iced = { version = "0.14", default-features = false, features = [
  "tiny-skia",
  # Nur Vektorpfade für die Icons (src/icon.rs); nutzt das ohnehin
  # vorhandene kurbo, kein resvg/usvg wie beim `svg`-Feature.
  "canvas",
  "tokio",
  "crisp",
  "web-colors",
  "x11",
  "wayland",
  "linux-theme-detection",
  # Videobilder (Streams) als RGBA-Puffer; ohne PNG/JPEG-Decoder.
  "image-without-codecs",
] }
reqwest.workspace = true
# Voice: dieselbe WebRTC-Bibliothek wie der SFU, Audio-I/O und Opus in Rust
# (libopus per c2rust übersetzt – keine C-Toolchain nötig).
str0m = "0.25"
cpal = "0.18"
unsafe-libopus = "0.2"
# Streams: H.264 über Ciscos OpenH264 (C++, wird aus dem Quelltext gebaut).
# Bewusste Ausnahme von „keine C-Toolchain“, siehe docs/DECISIONS.md.
openh264 = "0.9"
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio.workspace = true
tokio-tungstenite = { workspace = true, features = ["rustls-tls-webpki-roots"] }

# Bildschirmaufnahme für Streams (src/capture.rs): GDI bzw. X11, beides ohne
# zusätzliche C-Bibliotheken.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
x11rb = "0.13"

[features]
default = []
gpu = ["iced/wgpu"]

# Windows-Installer (NSIS) über cargo-packager – reines Rust-Werkzeug, lädt
# NSIS selbst. Installation pro Benutzer nach %LOCALAPPDATA%, damit der
# In-App-Updater die exe ohne Adminrechte austauschen kann. Pfade gelten
# relativ zum Workspace (Aufruf: `cargo packager -p nova-desktop --release`).
[package.metadata.packager]
product-name = "Nova Desktop"
identifier = "dev.nova.native"
description = "Nativer Nova-Client"
binaries = [{ path = "nova-desktop", main = true }]
icons = ["../../desktop/src-tauri/icons/icon.ico", "../../desktop/src-tauri/icons/icon.png"]
formats = ["nsis"]

[package.metadata.packager.nsis]
installer-mode = "currentUser"
