[workspace]
resolver = "2"
members = [
  "crates/common",
  "crates/db",
  "crates/api",
  "crates/gateway",
  "crates/voice-sfu",
  "crates/loadtest",
  "crates/nova",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
publish = false

[workspace.dependencies]
anyhow = "1.0"
argon2 = "0.5"
axum = { version = "0.8", features = ["ws", "multipart", "macros"] }
bitflags = { version = "2.6", features = ["serde"] }
bytes = "1.7"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive", "env"] }
dashmap = "6.1"
futures-util = "0.3"
hex = "0.4"
mimalloc = "0.1"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json"] }
rmp-serde = "1.3"
rust-embed = "8.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
socket2 = "0.5"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "chrono", "migrate", "macros"] }
thiserror = "2.0"
tokio = { version = "1.40", features = ["full"] }
tokio-tungstenite = { version = "0.26", features = ["connect"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace", "compression-gzip"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
