name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  DATABASE_URL: postgres://nova:nova@localhost:5432/nova
  SQLX_OFFLINE: "false"

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: nova
          POSTGRES_PASSWORD: nova
          POSTGRES_DB: nova
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Install Dioxus CLI
        run: cargo install dioxus-cli --version 0.7.0 --locked

      - name: Build Rust WASM UI
        run: |
          cd crates/ui
          dx build --web --release --features web
          cd ../..
          rm -rf crates/ui/dist
          mkdir -p crates/ui/dist
          cp -a target/dx/nova-ui/release/web/public/. crates/ui/dist/
          cp crates/ui/assets/app.css crates/ui/dist/assets/app.css

      - name: Apply schema (sqlx compile-time checks)
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f crates/db/migrations/0001_init.sql

      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo clippy -p nova-ui --target wasm32-unknown-unknown --features web -- -D warnings
      - run: cargo test --workspace

      - uses: actions/upload-artifact@v4
        with:
          name: nova-ui-dist
          path: crates/ui/dist

  publish:
    needs: checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: nova
          POSTGRES_PASSWORD: nova
          POSTGRES_DB: nova
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - uses: Swatinem/rust-cache@v2

      - uses: actions/download-artifact@v4
        with:
          name: nova-ui-dist
          path: crates/ui/dist

      - name: Install musl toolchain
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Apply schema (sqlx compile-time checks)
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f crates/db/migrations/0001_init.sql

      - name: Build release binaries
        env:
          NOVA_UPDATE_REPO: ${{ github.repository }}
        run: cargo build --release --target x86_64-unknown-linux-musl -p nova -p nova-loadtest

      - name: Package assets
        run: |
          mkdir -p dist
          cp target/x86_64-unknown-linux-musl/release/nova dist/nova-linux-x86_64
          cp target/x86_64-unknown-linux-musl/release/nova-loadtest dist/nova-loadtest-linux-x86_64
          cd dist
          sha256sum nova-linux-x86_64 > nova-linux-x86_64.sha256
          sha256sum nova-loadtest-linux-x86_64 > nova-loadtest-linux-x86_64.sha256

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "$GITHUB_REF_NAME" \
            --generate-notes

  desktop-windows:
    needs: publish
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "desktop/src-tauri -> target"

      - name: Install Tauri CLI (Rust)
        run: cargo install tauri-cli --version "^2" --locked

      - name: Build MSI and NSIS installers
        working-directory: desktop
        run: cargo tauri build --bundles nsis,msi

      - name: Upload Windows installers to release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            desktop/src-tauri/target/release/bundle/nsis/*.exe \
            desktop/src-tauri/target/release/bundle/msi/*.msi \
            --clobber

  desktop-linux:
    needs: publish
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "desktop/src-tauri -> target"

      - name: Install WebKitGTK and Tauri CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev patchelf
          cargo install tauri-cli --version "^2" --locked

      - name: Build deb and AppImage
        working-directory: desktop
        run: cargo tauri build --bundles deb,appimage

      - name: Upload Linux desktop packages to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            desktop/src-tauri/target/release/bundle/deb/*.deb \
            desktop/src-tauri/target/release/bundle/appimage/*.AppImage \
            --clobber
