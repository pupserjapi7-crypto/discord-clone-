name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  DATABASE_URL: postgres://nova:nova@localhost:5432/nova
  SQLX_OFFLINE: "false"

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: nova
          POSTGRES_PASSWORD: nova
          POSTGRES_DB: nova
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build frontend (rust-embed input)
        working-directory: web
        run: |
          npm ci --legacy-peer-deps
          npm run build

      - name: Apply schema (sqlx compile-time checks)
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f crates/db/migrations/0001_init.sql

      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  publish:
    needs: checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: nova
          POSTGRES_PASSWORD: nova
          POSTGRES_DB: nova
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - uses: Swatinem/rust-cache@v2

      - name: Install musl toolchain
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build frontend
        working-directory: web
        run: |
          npm ci --legacy-peer-deps
          npm run build

      # sqlx macros resolve against a live schema at compile time.
      - name: Apply schema (sqlx compile-time checks)
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f crates/db/migrations/0001_init.sql

      - name: Build release binaries
        env:
          NOVA_UPDATE_REPO: ${{ github.repository }}
        run: cargo build --release --target x86_64-unknown-linux-musl -p nova -p nova-loadtest

      - name: Package assets
        run: |
          mkdir -p dist
          cp target/x86_64-unknown-linux-musl/release/nova dist/nova-linux-x86_64
          cp target/x86_64-unknown-linux-musl/release/nova-loadtest dist/nova-loadtest-linux-x86_64
          cd dist
          sha256sum nova-linux-x86_64 > nova-linux-x86_64.sha256
          sha256sum nova-loadtest-linux-x86_64 > nova-loadtest-linux-x86_64.sha256

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
