name: ci

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  DATABASE_URL: postgres://nova:nova@localhost:5432/nova
  SQLX_OFFLINE: "false"

jobs:
  rust:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: nova
          POSTGRES_PASSWORD: nova
          POSTGRES_DB: nova
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: x86_64-unknown-linux-musl, wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Install musl toolchain
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      # rust-embed liest den eingecheckten Dioxus-Build aus crates/ui/dist.
      # Der WASM-Build selbst wird im Release-Workflow mit dx verifiziert.
      - name: Apply schema (sqlx compile-time checks)
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f crates/db/migrations/0001_init.sql

      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo clippy -p nova-ui --target wasm32-unknown-unknown --features web -- -D warnings
      - run: cargo test --workspace

      - name: Build release binary (musl)
        run: cargo build --release --target x86_64-unknown-linux-musl -p nova -p nova-loadtest

      - name: Security audit
        run: |
          cargo install cargo-audit --locked
          # Both advisories belong to optional sqlx drivers that are not enabled:
          # rsa -> sqlx-mysql, libsqlite3-sys -> sqlx-sqlite. Neither crate is in
          # the build graph (`cargo tree -i <crate>` is empty). Re-check on every
          # sqlx upgrade; all other advisories still fail the build.
          cargo audit --ignore RUSTSEC-2023-0071 --ignore RUSTSEC-2026-0459

      - uses: actions/upload-artifact@v4
        with:
          name: nova-x86_64-linux-musl
          path: |
            target/x86_64-unknown-linux-musl/release/nova
            target/x86_64-unknown-linux-musl/release/nova-loadtest
          retention-days: 14
